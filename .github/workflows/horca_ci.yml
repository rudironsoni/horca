name: 'Horca: CI'

on:
  pull_request:
  push:
    branches:
      - main
      - 'chore/**'
  workflow_dispatch:

concurrency:
  group: horca-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  overlay:
    if: github.repository == 'rudironsoni/orca'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare the fork overlay to stablyai/orca main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-prune-tags --no-tags https://github.com/stablyai/orca.git main
          node config/scripts/fork-upstream-overlay-guard.mjs \
            --ours HEAD \
            --theirs FETCH_HEAD

  verify:
    if: github.repository == 'rudironsoni/orca'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      - name: Lint
        run: pnpm exec oxlint --format github

      - name: Typecheck
        run: pnpm tc

      - name: Unit tests for Horca and Herdr contracts
        run: >
          pnpm exec vitest run --config config/vitest.config.ts
          src/shared/distribution-identity.test.ts
          src/main/local-state-root.test.ts
          src/main/providers/terminal-backend-composition.test.ts
          config/scripts/herdr-import-architecture.test.ts
          config/scripts/fork-upstream-overlay-guard.test.mjs
          src/main/claude-accounts/keychain.test.ts
          src/main/claude-accounts/claude-account-service-login-process.test.ts
