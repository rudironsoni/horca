name: Sync Upstream Main

# Why: keep rudironsoni/orca:upstream-main a SHA-identical mirror of
# stablyai/orca:main. A rejected push is the signal that history diverged;
# never force-update the mirror.
#
# Also mirrors upstream's desktop release tags (refs/tags/v*): the Skill
# update round trip check resolves v<appVersion> tags from
# resources/skills/release-mapping.json and fails on a fork missing them.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'rudironsoni/orca'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal main
        uses: actions/checkout@v6
        with:
          # Why full history: a shallow (depth-1) clone pushes only the tip
          # object, so the fork's receive side cannot connect the new tip to
          # the current mirror and rejects the update as non-fast-forward
          # (run 32399492042). blob:none keeps the fetch cheap; pushes only
          # need commits and trees plus the new delta fetched from upstream.
          fetch-depth: 0
          filter: blob:none
          # Why: GITHUB_TOKEN may not push commits whose history touches
          # .github/workflows (run 32406389294 rejected every such tag, and a
          # future upstream workflow change would break the branch sync the
          # same way). Set UPSTREAM_SYNC_TOKEN to a fork-owned fine-grained
          # PAT with contents + workflows write to lift the restriction; the
          # default token still handles non-workflow syncs.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Fast-forward upstream-main
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/stablyai/orca.git
          git fetch --no-tags upstream main
          upstream_tip="$(git rev-parse upstream/main)"

          mirror_tip=""
          if git fetch --no-tags origin upstream-main; then
            mirror_tip="$(git rev-parse origin/upstream-main)"
            if [ "$mirror_tip" = "$upstream_tip" ]; then
              echo "upstream-main already matches stablyai/orca:main ($upstream_tip)."
              exit 0
            fi
          fi

          if ! git push origin "${upstream_tip}:refs/heads/upstream-main"; then
            echo "::error title=Upstream mirror is not a fast-forward::rudironsoni/orca:upstream-main${mirror_tip:+ ($mirror_tip)} is no longer a fast-forward of stablyai/orca:main ($upstream_tip). The mirror was not updated. Do not force-push; inspect both branches before deciding how to recover."
            exit 1
          fi

          echo "Updated upstream-main to $upstream_tip."

      # Why v* only: desktop release tags are what release-mapping.json needs;
      # mobile-* and evidence tags stay out. Only tags absent from origin are
      # pushed — never forced, never deleted — so an existing divergent tag is
      # left alone. GITHUB_TOKEN pushes cannot trigger other workflows, so the
      # tag-triggered release workflows never fire from this mirror step.
      - name: Mirror upstream release tags
        shell: bash
        run: |
          set -euo pipefail

          upstream_url="https://github.com/stablyai/orca.git"

          list_v_tags() {
            git ls-remote --tags "$1" 'refs/tags/v*' | awk '$2 !~ /\^\{\}$/ { print $2 }' | sort
          }

          missing="$(comm -13 <(list_v_tags origin) <(list_v_tags "$upstream_url"))"
          if [ -z "$missing" ]; then
            echo "All upstream v* tags already exist on origin."
            exit 0
          fi

          refspecs=()
          while IFS= read -r ref; do
            refspecs+=("${ref}:${ref}")
          done <<<"$missing"

          # Why no depth limit: the push must carry every object the fork is
          # missing (e.g. release-branch commits behind a tag), or the server
          # rejects it for broken connectivity. The full local history plus
          # upstream/main serve as haves, so only the tag-side delta transfers.
          git fetch --no-tags "$upstream_url" "${refspecs[@]}"
          git push origin "${refspecs[@]}"

          echo "Mirrored ${#refspecs[@]} missing v* tag(s) from upstream."
