name: Sync Upstream Main

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  # Why: the last step opens the upstream-main -> main merge PR.
  pull-requests: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'rudironsoni/orca'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Why: GITHUB_TOKEN may not push commits whose history touches
          # .github/workflows (run 32406389294 rejected every such tag, and an
          # upstream workflow change would break the branch sync the same
          # way). Set UPSTREAM_SYNC_TOKEN to a fork-owned fine-grained PAT
          # with contents + workflows write to lift the restriction; the
          # default token still handles non-workflow syncs.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Fast-forward upstream mirror
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/stablyai/orca.git
          git fetch --no-tags upstream main
          upstream_tip="$(git rev-parse FETCH_HEAD)"

          # Why tolerate a missing mirror: merging the upstream-main -> main PR
          # deletes the head branch when "automatically delete head branches" is
          # enabled (observed after PR #17), which used to hard-fail every later
          # sync and silently stall the mirror. Recreate the branch at the
          # upstream tip; the divergence guard only applies when a mirror exists.
          if git fetch --no-tags origin upstream-main; then
            mirror_tip="$(git rev-parse FETCH_HEAD)"
            if ! git merge-base --is-ancestor "$mirror_tip" "$upstream_tip"; then
              echo "::error title=Upstream mirror diverged::upstream-main ($mirror_tip) cannot fast-forward to upstream main ($upstream_tip). Refusing to rewrite history."
              exit 1
            fi
          else
            echo "::warning title=Upstream mirror missing::upstream-main does not exist on origin (deleted by a merged sync PR?); recreating it at upstream main ($upstream_tip)."
          fi

          git push origin "$upstream_tip:refs/heads/upstream-main"

      # Why v* only: the Skill update round trip check resolves v<appVersion>
      # tags from resources/skills/release-mapping.json and fails on a fork
      # missing them (fatal: Not a valid object name v1.4.151). mobile-* and
      # evidence tags stay out. Tags present on both remotes must point at the
      # same object; a divergent tag fails the run and is never force-updated
      # or deleted — a wrong mirror tag needs a human.
      #
      # Trigger audit (2026-08-20, upstream 4e058d4a5): no workflow in this
      # repo triggers on v* tag pushes — the only push.tags consumers are
      # mobile-ios-v* and mobile-android-v*, which the v* refspec filter never
      # matches. GITHUB_TOKEN pushes cannot trigger workflows at all, but a
      # configured UPSTREAM_SYNC_TOKEN PAT can, so re-run this audit before
      # adding any tag-triggered workflow.
      - name: Mirror upstream release tags
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          upstream_url="https://github.com/stablyai/orca.git"

          list_v_tags() {
            git ls-remote --tags "$1" 'refs/tags/v*' | awk '$2 !~ /\^\{\}$/ { print $2 " " $1 }' | sort
          }

          list_v_tags origin > "$RUNNER_TEMP/origin-tags"
          list_v_tags "$upstream_url" > "$RUNNER_TEMP/upstream-tags"

          divergent="$(join "$RUNNER_TEMP/origin-tags" "$RUNNER_TEMP/upstream-tags" | awk '$2 != $3 { print $1 " origin=" $2 " upstream=" $3 }')"
          if [ -n "$divergent" ]; then
            echo "$divergent"
            echo "::error title=Tag mirror divergence::The v* tags above exist on both remotes with different objects. Refusing to overwrite; inspect and fix manually."
            exit 1
          fi

          missing="$(comm -13 <(awk '{ print $1 }' "$RUNNER_TEMP/origin-tags") <(awk '{ print $1 }' "$RUNNER_TEMP/upstream-tags"))"
          if [ -z "$missing" ]; then
            echo "All upstream v* tags already exist on origin and match by object id."
            exit 0
          fi

          refspecs=()
          while IFS= read -r ref; do
            refspecs+=("${ref}:${ref}")
          done <<<"$missing"

          # Why no depth limit: the push must carry every object the fork is
          # missing (e.g. release-branch commits behind a tag), or the server
          # rejects it for broken connectivity. The full local history plus
          # the fetched upstream refs serve as haves, so only the tag-side
          # delta transfers.
          git fetch --no-tags "$upstream_url" "${refspecs[@]}"
          git push origin "${refspecs[@]}"

          echo "Mirrored ${#refspecs[@]} missing v* tag(s) from upstream."

      # Why: a leftover fork patch in tests/e2e/helpers turned the same poll
      # wrapper into a merge conflict (PR #52). Fail the sync before opening
      # another dirty upstream-main -> main PR.
      - name: Guard fork overlays against high-churn upstream files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main upstream-main
          node config/scripts/fork-upstream-overlay-guard.mjs \
            --ours origin/main \
            --theirs origin/upstream-main

      # Why: main takes upstream through merge commits, never rebases
      # (docs/FORK_MAINTENANCE.md — a rebase already deleted fork work once).
      # Opening the PR here makes the merge path the default and lets CI and
      # conflicts surface before anything lands. The merge workflow lands it
      # after verify passes; an existing open PR follows upstream-main
      # automatically. Caveat: PRs
      # created by the default token get no PR CI; set UPSTREAM_SYNC_TOKEN
      # (PAT with pull-requests write) so checks run on the merge PR.
      - name: Open upstream merge PR when the mirror is ahead of main
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main upstream-main
          ahead="$(git rev-list --count origin/main..origin/upstream-main)"
          if [ "$ahead" -eq 0 ]; then
            echo "main already contains upstream-main."
            exit 0
          fi

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head upstream-main --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Merge PR #$existing is already open and tracks upstream-main."
            exit 0
          fi

          gh pr create --repo "$GITHUB_REPOSITORY" \
            --head upstream-main --base main \
            --title "chore: merge upstream-main into main" \
            --body "Automated by Sync Upstream Main: upstream-main is ${ahead} commit(s) ahead of main. CI merges this with a merge commit after verify passes. Never rebase or force-push main (docs/FORK_MAINTENANCE.md)."
