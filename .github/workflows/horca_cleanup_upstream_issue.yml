name: 'Horca: Close Accidental Upstream Issue'

on:
  workflow_dispatch:

permissions: {}

jobs:
  close:
    if: github.repository == 'rudironsoni/orca'
    runs-on: ubuntu-latest
    environment: horca-maintenance
    steps:
      - name: Create maintenance token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HORCA_APP_ID }}
          private-key: ${{ secrets.HORCA_APP_PRIVATE_KEY }}

      - name: Close accidental issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh issue close 16890 --repo stablyai/orca --comment 'Opened by Horca downstream maintenance automation in error. Closing it now. Sorry for the noise.'
