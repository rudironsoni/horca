name: Horca GitHub admin

# One-shot / on-demand repo admin via FORK_SYNC_PAT. Creates shepherd labels,
# turns off auto-delete of PR heads, and pins the main ruleset to
# refs/heads/main with deletion + non-fast-forward only.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horca-repo-admin.yml'
  workflow_dispatch:

concurrency:
  group: horca-repo-admin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  admin:
    if: github.repository == 'rudironsoni/orca'
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels, repo setting, and main ruleset
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_PAT || secrets.UPSTREAM_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          upsert_label() {
            local name="$1" color="$2" desc="$3"
            local body code
            body="$(jq -n --arg name "$name" --arg color "$color" --arg desc "$desc" \
              '{name:$name,color:$color,description:$desc}')"
            code="$(curl -sS -o /tmp/horca-label.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/labels" \
              -d "$body")"
            if [ "$code" = "201" ]; then
              echo "created label ${name}"
              return 0
            fi
            if [ "$code" = "422" ]; then
              code="$(curl -sS -o /tmp/horca-label.json -w '%{http_code}' -X PATCH \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${repo}/labels/${name}" \
                -d "$body")"
            fi
            if [ "$code" != "200" ]; then
              echo "label ${name} HTTP ${code}"
              cat /tmp/horca-label.json
              exit 1
            fi
            echo "updated label ${name}"
          }

          upsert_label sync-conflict B60205 "Fork Shepherd could not merge upstream"
          upsert_label sync-bot 0E8A16 "Fork Shepherd PR monitor"

          code="$(curl -sS -o /tmp/horca-repo.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${repo}" \
            -d '{"delete_branch_on_merge":false}')"
          if [ "$code" = "200" ]; then
            echo "delete_branch_on_merge=false"
          else
            echo "::warning::repo patch HTTP ${code} (needs Administration on FORK_SYNC_PAT)"
            cat /tmp/horca-repo.json
          fi

          jq -n '{
            name: "main",
            target: "branch",
            enforcement: "active",
            bypass_actors: [],
            conditions: { ref_name: { include: ["refs/heads/main"], exclude: [] } },
            rules: [ { type: "deletion" }, { type: "non_fast_forward" } ]
          }' > /tmp/horca-ruleset.json
          code="$(curl -sS -o /tmp/horca-ruleset-res.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${repo}/rulesets/21197837" \
            --data-binary @/tmp/horca-ruleset.json)"
          if [ "$code" != "200" ]; then
            echo "ruleset PUT HTTP ${code}"
            cat /tmp/horca-ruleset-res.json
            exit 1
          fi
          echo "ruleset main: deletion + non_fast_forward on refs/heads/main"
