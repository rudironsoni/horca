name: Merge upstream sync PR

on:
  workflow_run:
    workflows:
      - PR Checks
    types:
      - completed
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-upstream-main
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.repository == 'rudironsoni/orca' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'upstream-main'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Merge the current green upstream sync PR
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Missing sync token::UPSTREAM_SYNC_TOKEN is required so the merge triggers normal push workflows."
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            pr_number="$RUN_PR_NUMBER"
            expected_head="$RUN_HEAD_SHA"
          else
            pr_number="$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head upstream-main \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number // empty')"
            if [ -z "$pr_number" ]; then
              echo "No open upstream-main -> main PR to reconcile."
              exit 0
            fi
            expected_head="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          fi

          if [ -z "$pr_number" ] || [ -z "$expected_head" ]; then
            echo "The completed PR Checks run is not associated with a pull request."
            exit 0
          fi

          pr="$(gh pr view "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --json baseRefName,headRefName,headRefOid,isCrossRepository,isDraft,mergeable,state,statusCheckRollup)"

          if ! jq -e \
            --arg expected_head "$expected_head" \
            '.state == "OPEN"
              and .isDraft == false
              and .isCrossRepository == false
              and .baseRefName == "main"
              and .headRefName == "upstream-main"
              and .headRefOid == $expected_head' \
            <<<"$pr" >/dev/null; then
            echo "PR #$pr_number no longer matches the trusted upstream sync head."
            exit 0
          fi

          verify_conclusion="$(jq -r \
            '[.statusCheckRollup[]
              | select(.name == "verify" and .workflowName == "PR Checks")
              | .conclusion] | last // empty' \
            <<<"$pr")"
          if [ "$verify_conclusion" != "SUCCESS" ]; then
            echo "PR #$pr_number does not have a successful PR Checks / verify result for $expected_head."
            exit 0
          fi

          if [ "$(jq -r '.mergeable' <<<"$pr")" != "MERGEABLE" ]; then
            echo "PR #$pr_number is not currently mergeable; leaving it open for reconciliation."
            exit 0
          fi

          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --match-head-commit "$expected_head"
